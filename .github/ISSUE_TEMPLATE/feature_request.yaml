name: ✨ Feature Request
description: Suggest a new skill, or an improvement to an existing one
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We appreciate your ideas.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What are you trying to build, and where does the toolkit leave you stuck?
      placeholder: "I'm trying to build... and I get stuck when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Which Amadeus API should be covered, or how should an existing skill change?
      placeholder: Describe your ideal solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you thought of other ways to solve this?
      placeholder: What other approaches could work?

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Can you provide examples of this feature in other tools?
      placeholder: |
        - Example 1: [Tool Name] does X by...
        - Example 2: [Tool Name] handles this with...

  - type: dropdown
    id: priority
    attributes:
      label: Priority (from your perspective)
      description: How important is this to you?
      options:
        - Low - Nice to have
        - Medium - Would improve my workflow
        - High - Blocking my use of the project
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any mockups, diagrams, or additional information?
      placeholder: Add any other context about the feature request here
